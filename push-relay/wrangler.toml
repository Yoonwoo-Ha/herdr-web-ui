name = "ovis-push-relay"
main = "worker.ts"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "push.ovis.sh", custom_domain = true }]

# Workers Logs would keep each request, the sender's address with it: off.
[observability]
enabled = false

[triggers]
crons = ["17 3 * * *"]

[vars]
APNS_TOPIC = "sh.ovis.app"

# namespace_id is any integer unique to the account.
[[ratelimits]]
name = "REGISTER_LIMITER"
namespace_id = "1695"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "REGISTER_GLOBAL_LIMITER"
namespace_id = "1696"

  [ratelimits.simple]
  limit = 60
  period = 60

[[d1_databases]]
binding = "DB"
database_name = "ovis-push-relay"
database_id = "1bdfce07-d5b5-40e9-8a56-77cc88b033fa"
