name: Release
# A vX.Y.Z tag is what installs update to (server/updater.ts follows these tags only).
# The release checks that package.json, herdr-plugin.toml and CHANGELOG.md agree with the tag.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Versions match the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          test "$(bun -e 'console.log(require("./package.json").version)')" = "$version"
          grep -qx "version = \"$version\"" herdr-plugin.toml
          grep -q "^## \[$version\]" CHANGELOG.md
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run build
      # the suites that need no live herdr server
      - run: |
          git config --global user.email ci@example.invalid
          git config --global user.name CI
          bun test src/lib server/updater.test.ts server/tailscale.test.ts server/access.test.ts server/devices.test.ts
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on && !/^\[[^]]+\]: /' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "herdr web ui $TAG" --notes-file notes.md --verify-tag
