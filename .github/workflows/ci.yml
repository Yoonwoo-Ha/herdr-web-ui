name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fast:
    name: Fast checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Validate workflow syntax
        run: |
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tgz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum --check
          tar xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=
      - run: bun run generate:types --check
      - run: bun run typecheck
      - run: bun run build
      - name: Unit tests (no herdr required)
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name CI
          bun run test:unit
  integration:
    name: Integration and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HERDR_TEST_SESSION: ci-${{ github.run_id }}-${{ github.run_attempt }}
      XDG_CONFIG_HOME: ${{ github.workspace }}/.ci-config
      HERDR_WEB_STATE_DIR: ${{ github.workspace }}/.ci-state
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install checksum-pinned herdr 0.9.1
        run: |
          mkdir -p "$RUNNER_TEMP/herdr-bin"
          curl --fail --location --retry 3 https://github.com/herdrdev/herdr/releases/download/v0.9.1/herdr-linux-x86_64 -o "$RUNNER_TEMP/herdr-bin/herdr"
          echo "2a02fed16beb651ef006e1d43f048f652ca4dc58ad053cd2d44450563d5c54b7  $RUNNER_TEMP/herdr-bin/herdr" | sha256sum --check
          chmod +x "$RUNNER_TEMP/herdr-bin/herdr"
          echo "$RUNNER_TEMP/herdr-bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Integration tests including updater restart and rollback
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name CI
          bun run test:integration
      - name: Install the lockfile's Playwright Chromium
        run: |
          bun node_modules/playwright-core/cli.js install --with-deps chromium
          bun -e 'console.log("CHROME_PATH=" + require("playwright-core").chromium.executablePath())' >> "$GITHUB_ENV"
      - run: bun scripts/ui-regression.ts
      - run: bun scripts/file-viewer-regression.ts
      - name: Stop the owned test session
        if: always()
        run: |
          if command -v herdr >/dev/null; then
            herdr --session "$HERDR_TEST_SESSION" server stop || true
          fi
      - name: Preserve failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: herdr-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-config/herdr/sessions/*/test-server.log
          if-no-files-found: ignore
