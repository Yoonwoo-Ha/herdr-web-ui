name: CI flakes
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-flakes
  cancel-in-progress: false
jobs:
  report:
    name: Report flaky browser scripts
    if: github.repository == 'devswha/ovis'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          cache: none
      - name: Update the CI flakes issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bun scripts/ci-flakes-issue.ts --hours 24 --repo "$REPO"
