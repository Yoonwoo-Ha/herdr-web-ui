name: Website
# Builds site/ into the GitHub Pages site (https://devswha.github.io/herdr-web-ui/) on every push to
# main that touches the page or what it shows. README.md is a source too: the demo videos come from
# the uploads it links (docs/development.md, "README media").
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-site.ts'
      - 'public/**'
      - 'docs/screenshots/**'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun scripts/build-site.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
