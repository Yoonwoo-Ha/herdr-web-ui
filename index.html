<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="Chat with your coding agents and use live herdr terminals from your browser or phone." />
    <meta property="og:title" content="herdr web ui" />
    <meta property="og:description" content="Your agents. Any screen. Chat, terminal and mobile access for herdr." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://raw.githubusercontent.com/devswha/herdr-web-ui/main/public/social-preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="herdr web ui — ram, terminal prompt, browser window and pointer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#181613" />
    <meta name="color-scheme" content="dark" />
    <!-- The query is a URL no pre-0.3.32 service worker has cached: those serve the plain
         URL cache-first, which handed Chrome the old `orientation: "any"` manifest on the
         first launch after an upgrade and spent that day's installed-app update check. -->
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <link rel="icon" href="/favicon.ico?v=ram1" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon.png?v=ram1" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=ram1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- No apple-mobile-web-app-status-bar-style: with "black-translucent" the page ran under the
         iOS status bar, and since iOS 26 the home-screen app lays its Liquid Glass edge blur over
         the top ~110 px of such a page, header text included, in either theme (#164). With the
         default style the web view starts below an opaque status bar tinted from theme-color, and
         nothing is blurred. iOS reads this once, when the app is added to the Home Screen. -->
    <meta name="apple-mobile-web-app-title" content="herdr" />
    <title>herdr web ui</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module" src="/src/pwa.ts"></script>
  </body>
</html>
