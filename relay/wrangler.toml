name = "ovis-relay"
main = "worker.ts"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "relay.ovis.sh", custom_domain = true }]

# Workers Logs would keep each request, the connecting address with it: off.
[observability]
enabled = false

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayRoom"

[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "ovis_relay_usage"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

# namespace_id is any integer unique to the account (push-relay has 1695, 1696).
[[ratelimits]]
name = "RELAY_LIMITER"
namespace_id = "1697"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "RELAY_GLOBAL_LIMITER"
namespace_id = "1698"

  [ratelimits.simple]
  limit = 600
  period = 60

[[ratelimits]]
name = "RELAY_PC_LIMITER"
namespace_id = "1703"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "RELAY_PASS_CHECK_LIMITER"
namespace_id = "1704"

  [ratelimits.simple]
  limit = 30
  period = 60

# An environment inherits the routes above unless it names its own, and no binding is inherited,
# so each is named again.
[env.staging]
name = "ovis-relay-staging"
workers_dev = true
routes = []

[env.staging.vars]
RELAY_PASS_MODE = "enforce"

[[env.staging.durable_objects.bindings]]
name = "RELAY"
class_name = "RelayRoom"

[[env.staging.analytics_engine_datasets]]
binding = "USAGE"
dataset = "ovis_relay_usage_staging"

[[env.staging.ratelimits]]
name = "RELAY_LIMITER"
namespace_id = "1699"

  [env.staging.ratelimits.simple]
  limit = 30
  period = 60

[[env.staging.ratelimits]]
name = "RELAY_GLOBAL_LIMITER"
namespace_id = "1700"

  [env.staging.ratelimits.simple]
  limit = 600
  period = 60

[[env.staging.ratelimits]]
name = "RELAY_PC_LIMITER"
namespace_id = "1705"

  [env.staging.ratelimits.simple]
  limit = 30
  period = 60

[[env.staging.ratelimits]]
name = "RELAY_PASS_CHECK_LIMITER"
namespace_id = "1706"

  [env.staging.ratelimits.simple]
  limit = 30
  period = 60
